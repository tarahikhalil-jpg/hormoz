<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071725"><title>مدیریت اتصال سازمان‌ها | هرمز</title>
<style>
:root{color-scheme:dark;--bg:#071725;--panel:#102b40;--line:#31566c;--text:#f4f9fc;--muted:#c0d1dc;--aqua:#7cebdc;--gold:#ffdc9b}*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(ellipse at top,#17445a,#071725 65%);color:var(--text);font:15px/1.9 Tahoma,Arial,sans-serif}main{max-width:1050px;margin:auto}.panel,.card{background:linear-gradient(145deg,#12354a,#0b1e2d);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}h1,h2{color:var(--aqua)}input,select,textarea{width:100%;padding:10px;border:1px solid #456a7e;border-radius:9px;background:#071725;color:var(--text);font:inherit}textarea{min-height:70px}.btn{padding:10px 16px;border:0;border-radius:10px;background:linear-gradient(145deg,#fff0bd,#d39a43);color:#142536;font:inherit;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:4px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.tag{display:inline-block;background:#21473d;color:#b8f5d6;padding:2px 10px;border-radius:30px;font-size:12px}.ltr{direction:ltr;text-align:left;overflow-wrap:anywhere}.error{color:#ffc0c0}.success{color:#b8f5d6}@media(max-width:600px){body{padding:8px}.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>پنل بررسی پرونده‌های اتصال سازمانی</h1><p class="muted">این صفحه فقط برای مدیر اصلی است. تأیید اولیه به معنی مجوز تبادل داده نیست؛ وضعیت «اتصال فعال» فقط پس از احراز مجوز رسمی قابل ثبت است.</p>
<section class="panel" id="loginBox"><h2>ورود مدیر اصلی</h2><div class="field"><label for="password">رمز مدیریت</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn" id="login">ورود امن</button></div><p id="loginMsg" aria-live="polite"></p></section>
<section id="adminBox" class="hidden"><div class="actions"><button class="btn" id="refresh">به‌روزرسانی پرونده‌ها</button><button class="btn" id="logout">خروج</button></div><p id="msg" aria-live="polite"></p><div id="list"></div></section></main>
<script>
const $=id=>document.getElementById(id);let token="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const types={ministry:"وزارتخانه و سازمان ملی",provincial:"استانداری و دستگاه استانی",municipality:"شهرداری",public_agency:"نهاد عمومی",bank_finance:"بانک و مالی",insurance:"بیمه",judicial_registry:"قضایی و ثبتی",e_services:"پیشخوان و خدمات الکترونیک",education:"آموزش",healthcare:"درمان",telecom_utility:"مخابرات و خدمات زیربنایی",charity:"خیریه",private_company:"شرکت خصوصی",business:"کسب‌وکار",international:"بین‌المللی",other:"سایر"};
const statuses={screening:"بررسی اولیه",needs_information:"نیازمند تکمیل اطلاعات",approved:"تأیید اولیه",rejected:"رد درخواست",connected:"اتصال فعال طبق مجوز"};
async function api(url,body){const r=await fetch(url,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw new Error(d.message||"خطای سرور");return d;}
$("login").onclick=async()=>{const b=$("login");b.disabled=true;$("loginMsg").textContent="در حال ورود…";try{const d=await api("/api/v1/global-admin/login",{password:$("password").value});token=d.token;$("loginBox").classList.add("hidden");$("adminBox").classList.remove("hidden");await load();}catch(e){$("loginMsg").className="error";$("loginMsg").textContent=e.message;}finally{b.disabled=false;}};
async function load(){ $("msg").textContent="در حال دریافت پرونده‌ها…";try{const d=await api("/api/v1/global-admin/organization-connections");const list=$("list");list.replaceChildren();if(!d.connections.length){$("msg").textContent="هنوز پرونده‌ای ثبت نشده است.";return;}$("msg").textContent=d.connections.length+" پرونده سازمانی";for(const x of d.connections){const card=document.createElement("article");card.className="card";const opts=Object.entries(statuses).map(([v,l])=>'<option value="'+v+'" '+(x.status===v?"selected":"")+'>'+l+"</option>").join("");card.innerHTML='<h2>'+esc(x.organization_name)+' <span class="tag">'+esc(types[x.organization_type]||x.organization_type)+'</span></h2><p>شماره پرونده: <b class="ltr">'+esc(x.reference_number)+'</b> | کشور/منطقه: '+esc(x.country)+' / '+esc(x.region)+'</p><p>نماینده: '+esc(x.representative_name)+' — '+esc(x.representative_title)+'<br>راه تماس: '+esc(x.contact)+'<br>ایمیل سازمانی: '+esc(x.official_email)+'<br>وب‌سایت: '+(x.website?'<a href="'+esc(x.website)+'" target="_blank" rel="noopener noreferrer">'+esc(x.website)+'</a>':"ثبت نشده")+'</p><p><b>خدمات درخواستی:</b><br>'+esc(x.services_description)+'</p><p><b>روش همکاری:</b> '+esc(x.integration_type)+'</p><div class="grid"><label class="field">وضعیت<select class="status">'+opts+'</select></label><label class="field">یادداشت قابل مشاهده برای سازمان<textarea class="public">'+esc(x.public_note)+'</textarea></label><label class="field" style="grid-column:1/-1">یادداشت داخلی مدیر<textarea class="internal">'+esc(x.admin_note)+'</textarea></label></div><label><input class="auth" type="checkbox" style="width:auto"> مجوز رسمی و دامنه دسترسی این اتصال بررسی و تأیید شده است (برای وضعیت اتصال فعال الزامی).</label><div class="actions"><button class="btn save">ذخیره بررسی</button></div><p class="muted">ثبت: '+new Date(x.created_at).toLocaleString("fa-IR")+'</p>';
card.querySelector(".save").onclick=async ev=>{const btn=ev.currentTarget;btn.disabled=true;try{const status=card.querySelector(".status").value;await api("/api/v1/global-admin/organization-connections/"+encodeURIComponent(x.id)+"/review",{status,publicNote:card.querySelector(".public").value,adminNote:card.querySelector(".internal").value,authorizationConfirmed:card.querySelector(".auth").checked});$("msg").className="success";$("msg").textContent="پرونده "+x.reference_number+" به‌روزرسانی شد.";await load();}catch(e){$("msg").className="error";$("msg").textContent=e.message;}finally{btn.disabled=false;}};list.append(card);}}catch(e){$("msg").className="error";$("msg").textContent=e.message;}}
$("refresh").onclick=load;$("logout").onclick=()=>{token="";$("adminBox").classList.add("hidden");$("loginBox").classList.remove("hidden");$("password").value="";};
</script></body></html>
