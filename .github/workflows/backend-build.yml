name: Backend TypeScript build

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hormoz_test:hormoz_test@localhost:5432/hormoz_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hormoz_test
          POSTGRES_PASSWORD: hormoz_test
          POSTGRES_DB: hormoz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hormoz_test -d hormoz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies without the stale lockfile
        working-directory: backend
        run: npm install --package-lock=false
      - name: Run backend unit tests
        working-directory: backend
        run: npm test
      - name: Build TypeScript backend
        working-directory: backend
        run: npm run build
