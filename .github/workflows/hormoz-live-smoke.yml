name: Hormoz live smoke tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hormoz-live-smoke.yml"
      - ".github/workflows/backend-ci.yml"
      - "backend/src/**"
      - "backend/public/**"
      - "backend/package.json"
      - "index.html"
      - "orders.html"
      - "track-order.html"
      - "invoice.html"
      - "manifest.json"
      - "sw.js"
  pull_request:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/public/**"
      - "backend/package.json"
      - "index.html"
      - "orders.html"
      - "track-order.html"
      - "invoice.html"
      - "manifest.json"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public pages, health, database, AI chat, and Persian audio
        run: |
          node <<'NODE'
          const base = "https://hormoz-ai-backend-777.onrender.com";
          const portal = "https://hormoz-portal-public-777.onrender.com";
          const failures = [];
          async function check(name, fn) {
            try {
              const detail = await fn();
              console.log("PASS:", name, detail || "");
            } catch (e) {
              failures.push(name + ": " + (e?.message || String(e)));
              console.error("FAIL:", name, e?.message || e);
            }
          }
          async function get(path) {
            const r = await fetch(base + path, { signal: AbortSignal.timeout(45000) });
            const text = await r.text();
            if (!r.ok) throw new Error("HTTP " + r.status + " " + text.slice(0, 180));
            return { r, text };
          }
          await check("Unified public portal", async () => {
            const r = await fetch(portal + "/", { signal: AbortSignal.timeout(45000) });
            const html = await r.text();
            if (!r.ok || !html.includes('id="hormoz-module-shell"') ||
                !html.includes('https://hormoz-ai-backend-777.onrender.com') ||
                !html.includes('hormoz-music%20(1).mp3')) {
              throw new Error("portal shell/API/music references missing; HTTP " + r.status);
            }
            return "main public page serves the unified shell, canonical backend and music player";
          });
          for (const path of ["/app.html", "/HormozAI.html"]) {
            await check("Single-entry alias " + path, async () => {
              const r = await fetch(portal + path, { signal: AbortSignal.timeout(45000) });
              const html = await r.text();
              if (!r.ok || !html.includes("location.replace") ||
                  !html.includes("https://hormoz-portal-public-777.onrender.com/")) {
                throw new Error("alias does not redirect to the canonical portal; HTTP " + r.status);
              }
              return "redirects to the same canonical public page";
            });
          }
          await check("Shared portal/app music asset", async () => {
            const r = await fetch(portal + "/hormoz-music%20(1).mp3", {
              headers: { Range: "bytes=0-2047" }, signal: AbortSignal.timeout(45000)
            });
            const bytes = await r.arrayBuffer();
            const type = r.headers.get("content-type") || "";
            if (!(r.ok || r.status === 206) || !type.toLowerCase().includes("audio") || bytes.byteLength < 1000) {
              throw new Error("music asset unavailable: HTTP " + r.status + ", " + type + ", " + bytes.byteLength + " bytes");
            }
            return "shared music file is publicly served (" + bytes.byteLength + " bytes checked)";
          });
          await check("API health", async () => {
            const { text } = await get("/api/v1/health");
            const data = JSON.parse(text);
            if (data.status !== "ok") throw new Error("unexpected response " + text.slice(0,180));
            return "backend is responding";
          });
          await check("Persistent order database", async () => {
            const { text } = await get("/api/v1/global-orders/health");
            const data = JSON.parse(text);
            if (data.ok !== true || data.storage !== "persistent") throw new Error("database not persistent: " + text.slice(0,180));
            return "database query and order-table setup passed";
          });
          for (const path of ["/", "/orders.html", "/track-order.html", "/invoice.html", "/market.html", "/organization-portal.html", "/agency-connect.html"]) {
            await check("Page " + path, async () => {
              const { r, text } = await get(path);
              if (!text.trim()) throw new Error("empty page");
              if (path === "/organization-portal.html" &&
                  (!text.includes('Authorization') || /demoLogin|demoMode|ورود به نسخه آزمایشی/.test(text))) {
                throw new Error("organization portal is not real-key-only or demo UI remains");
              }
              if (path === "/agency-connect.html" && !text.includes("ثبت درخواست اتصال سازمانی")) {
                throw new Error("organization onboarding form missing");
              }
              return "HTTP " + r.status + ", " + text.length + " characters";
            });
          }
          await check("Market public listing API", async () => {
            const { text } = await get("/api/v1/market/ads");
            const data = JSON.parse(text);
            if (!Array.isArray(data.ads)) throw new Error("market API did not return an ads array: " + text.slice(0,180));
            return "public ads endpoint returned " + data.ads.length + " active listing(s)";
          });
          await check("Nava AI response", async () => {
            const r = await fetch(base + "/api/v1/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: "فقط با یک کلمه فارسی پاسخ بده: سلام" }),
              signal: AbortSignal.timeout(60000)
            });
            const text = await r.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error("non-JSON response: " + text.slice(0,180)); }
            if (!r.ok || data.success !== true || typeof data.response !== "string" || !data.response.trim()) {
              throw new Error("HTTP " + r.status + ": " + (data.error || text).toString().slice(0,220));
            }
            return "AI returned a non-empty answer";
          });
          await check("Female-only Persian Nava TTS (audio or explicit unavailable; no male fallback)", async () => {
            const r = await fetch(base + "/api/v1/tts", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "audio/*" },
              body: JSON.stringify({ text: "سلام، من نوا هستم." }),
              signal: AbortSignal.timeout(150000)
            });
            const bytes = await r.arrayBuffer();
            const type = r.headers.get("content-type") || "";
            if (r.status === 503 && type.toLowerCase().includes("json")) {
              const data = JSON.parse(new TextDecoder().decode(bytes));
              if (typeof data.error === "string" && data.error.includes("صدای فارسی نوا")) {
                throw new Error("female Persian voice provider is unavailable; release gate requires working female audio");
              }
            }
            if (!r.ok || !type.toLowerCase().includes("audio") || bytes.byteLength < 1000) {
              const detail = type.includes("json") ? new TextDecoder().decode(bytes).slice(0,220) : type;
              throw new Error("HTTP " + r.status + ", type=" + type + ", bytes=" + bytes.byteLength + ", " + detail);
            }
            return "female-provider audio response received (" + bytes.byteLength + " bytes)";
          });
          await check("Invalid order is rejected safely", async () => {
            const r = await fetch(base + "/api/v1/global-orders", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ serviceType: "", details: {}, consent: false }),
              signal: AbortSignal.timeout(45000)
            });
            const text = await r.text();
            if (r.status !== 400 && r.status !== 429) throw new Error("expected safe HTTP 400 or rate-limit 429, got " + r.status + ": " + text.slice(0,180));
            return r.status === 429
              ? "rate limiter safely rejected the repeated smoke-test request; no production order was created"
              : "validation works; no production order was created";
          });
          if (failures.length) {
            console.error("\nSMOKE TEST FAILURES:\n" + failures.join("\n"));
            process.exit(1);
          }
          console.log("\nALL LIVE SMOKE TESTS PASSED");
          NODE
